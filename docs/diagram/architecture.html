<!doctype html>
<!-- Source of docs/assets/aoa-ids-architecture.png. Render: see docs/diagram/README.md -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>AOA-IDS architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;700&family=Inter:wght@500&display=block" rel="stylesheet">
<style>
  /* Tokens from docs/promo/frame.md: amber = the watching agent. Dashed = in the pipeline. */
  :root {
    --bg: #0A0F0D; --panel: #111A16; --panel-2: #16211C; --hairline: #26362F;
    --fg: #E7EEE9; --muted: #93A79D; --accent: #FFB21E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 480px; background: transparent; }
  .canvas {
    position: relative; width: 1200px; height: 480px; overflow: hidden; border-radius: 22px;
    border: 1px solid var(--hairline); color: var(--fg);
    background:
      radial-gradient(420px 260px at 600px 240px, rgba(255,178,30,.16), transparent 70%),
      linear-gradient(rgba(38,54,47,.32) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgba(38,54,47,.32) 1px, transparent 1px) 0 0 / 40px 40px,
      var(--bg);
  }
  .block {
    position: absolute; display: flex; flex-direction: column; justify-content: center; gap: 12px;
    padding: 0 30px; border-radius: 18px; border: 1px solid var(--hairline);
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
  }
  .block h2 { font: 400 25px/1.1 "Archivo Black", sans-serif; white-space: nowrap; }
  .block p { white-space: nowrap; font: 400 15px/1.3 "JetBrains Mono", monospace; color: var(--muted); }
  .block.soon { border-style: dashed; border-width: 1.5px; background: rgba(17,26,22,.65); }
  .tag { position: absolute; top: 18px; right: 18px; font: 700 11px/1 "JetBrains Mono", monospace; letter-spacing: .12em;
         color: var(--muted); border: 1px dashed var(--muted); border-radius: 6px; padding: 5px 7px; }
  .judge { align-items: center; text-align: center; border: 2px solid var(--accent);
           background: linear-gradient(180deg, #1f1b0f, #141209);
           box-shadow: 0 0 0 8px rgba(255,178,30,.07), 0 24px 70px rgba(255,178,30,.22); }
  .judge h2 { font-size: 46px; color: var(--accent); }
  .judge p { color: var(--fg); font-family: Inter, sans-serif; font-weight: 500; font-size: 17px; }
  .label { position: absolute; font: 700 12px/1 "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase;
           color: var(--muted); background: var(--bg); padding: 5px 7px; border-radius: 6px; }
  .label.amber { color: var(--accent); }
</style>
</head>
<body>
<div class="canvas">
  <div class="block" style="left:56px; top:56px; width:300px; height:150px;">
    <h2>AI observability</h2>
    <p>Opik · Langfuse · Phoenix</p>
  </div>
  <div class="block soon" style="left:56px; top:274px; width:300px; height:150px;">
    <span class="tag">SOON</span>
    <h2>SIEM &amp; logs</h2>
    <p>Splunk · Sentinel · Elastic</p>
  </div>

  <div class="block judge" style="left:452px; top:130px; width:296px; height:220px;">
    <h2>AOA-IDS</h2>
    <p>AI judge agent</p>
  </div>

  <div class="block" style="left:844px; top:165px; width:300px; height:150px;">
    <h2>Alert management</h2>
    <p>PagerDuty · Slack</p>
  </div>

  <svg style="position:absolute; left:0; top:0" width="1200" height="480">
    <defs>
      <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#93A79D"/></marker>
      <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FFB21E"/></marker>
    </defs>
    <path d="M360 131 C 405 131, 400 210, 444 210" stroke="#93A79D" stroke-width="2.2" fill="none" marker-end="url(#m)"/>
    <path d="M360 349 C 405 349, 400 270, 444 270" stroke="#93A79D" stroke-width="2.2" stroke-dasharray="6 6" fill="none" marker-end="url(#m)"/>
    <path d="M754 240 L 836 240" stroke="#FFB21E" stroke-width="2.6" fill="none" marker-end="url(#a)"/>
  </svg>
  <div class="label" style="left:366px; top:98px;">traces</div>
  <div class="label" style="left:374px; top:362px;">logs</div>
  <div class="label amber" style="left:760px; top:206px;">alerts</div>
</div>
</body>
</html>
