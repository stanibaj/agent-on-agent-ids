<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        #s1-hook {
          position: absolute;
          inset: 0;
          font-family: "JetBrains Mono", monospace;
          color: #e7eee9;
        }
        #s1-ghost {
          position: absolute;
          left: 0;
          top: 150px;
          width: 100%;
          font-family: "Archivo Black", sans-serif;
          font-size: 230px;
          line-height: 1;
          color: #121b17;
          white-space: nowrap;
          letter-spacing: -0.02em;
        }
        #s1-ghost div {
          display: block;
          width: max-content;
        }
        #s1-main {
          position: absolute;
          left: 110px;
          right: 110px;
          top: 230px;
        }
        #s1-kicker {
          font-size: 34px;
          color: #ffb21e;
          letter-spacing: 0.02em;
          margin-bottom: 34px;
        }
        .s1-line {
          display: block;
          width: max-content;
          font-family: "Archivo Black", sans-serif;
          font-size: 170px;
          line-height: 0.98;
          letter-spacing: -0.035em;
          text-transform: uppercase;
        }
        #s1-root-word {
          color: #ff5b47;
        }
        #s1-bar {
          display: block;
          width: 820px;
          height: 10px;
          margin-top: 40px;
          background: #ffb21e;
          transform-origin: 0 50%;
        }
        #s1-sub {
          margin-top: 44px;
          font-size: 50px;
          color: #93a79d;
          min-height: 64px;
          white-space: nowrap;
        }
        #s1-caret {
          display: inline-block;
          width: 26px;
          height: 52px;
          margin-left: 6px;
          vertical-align: -8px;
          background: #ffb21e;
        }
      </style>

      <div data-hf-id="hf-m2dz" id="s1-hook" data-composition-id="s1-hook" data-width="1920" data-height="1080">
        <div data-hf-id="hf-851t" id="s1-ghost" aria-hidden="true" data-layout-ignore="">
          <div data-hf-id="hf-vg68" id="s1-ghost-a" aria-hidden="true" data-layout-ignore="">terminal · ssh · sudo · git push · cron</div>
          <div data-hf-id="hf-64ep" id="s1-ghost-b" aria-hidden="true" data-layout-ignore="">memory · skills · secrets · web_extract</div>
          <div data-hf-id="hf-elfs" id="s1-ghost-c" aria-hidden="true" data-layout-ignore="">read_file · patch · execute_code · tee</div>
        </div>
        <div data-hf-id="hf-yspp" id="s1-main">
          <div data-hf-id="hf-h5ls" id="s1-kicker">// tool-using AI agents, in production</div>
          <div data-hf-id="hf-hwx5" class="s1-line" id="s1-l1">Your agent</div>
          <div data-hf-id="hf-eruw" class="s1-line" id="s1-l2">has <span data-hf-id="hf-8b66" id="s1-root-word">root.</span></div>
          <div data-hf-id="hf-b8lh" id="s1-bar"></div>
          <div data-hf-id="hf-v7z0" id="s1-sub"><span data-hf-id="hf-xajh" id="s1-typed"></span><span data-hf-id="hf-eet0" id="s1-caret"></span></div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const typed = document.getElementById("s1-typed");
          const text = "…and it reads untrusted text all day.";

          // Ambient: ghost tool names drift in opposite directions.
          tl.fromTo("#s1-ghost-a", { x: -40 }, { x: -260, duration: 4, ease: "none" }, 0);
          tl.fromTo("#s1-ghost-b", { x: -420 }, { x: -160, duration: 4, ease: "none" }, 0);
          tl.fromTo("#s1-ghost-c", { x: -120 }, { x: -380, duration: 4, ease: "none" }, 0);

          // Statement relay: kicker, then two slammed lines with different directions/eases.
          tl.fromTo("#s1-kicker", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.15);
          tl.fromTo("#s1-l1", { opacity: 0, y: 90 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.3);
          tl.fromTo("#s1-l2", { opacity: 0, y: 90 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.55);
          tl.fromTo("#s1-root-word", { color: "#e7eee9" }, { color: "#ff5b47", duration: 0.25, ease: "power1.in" }, 1.05);
          tl.fromTo("#s1-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power4.inOut" }, 0.9);

          // Machine voice types the line (deterministic: text is a pure function of tween progress).
          const proxy = { n: 0 };
          tl.fromTo(
            proxy,
            { n: 0 },
            {
              n: text.length,
              duration: 1.35,
              ease: "none",
              onUpdate: () => {
                typed.textContent = text.slice(0, Math.round(proxy.n));
              },
            },
            1.45,
          );
          tl.fromTo("#s1-caret", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 1.4);
          tl.fromTo("#s1-caret", { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "steps(1)", yoyo: true, repeat: 3, immediateRender: false }, 2.85);

          // Exit: lift and clear.
          tl.to("#s1-main", { y: -60, opacity: 0, duration: 0.35, ease: "power2.in" }, 3.6);
          tl.to("#s1-ghost", { opacity: 0, duration: 0.35, ease: "power1.in" }, 3.6);

          window.__timelines["s1-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
